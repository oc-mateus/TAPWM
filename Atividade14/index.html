<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário Principal</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../assets/tapwm-theme.css">
</head>
<body>

  <div class="form-panel">
    <h1>Formulário Principal</h1>

    <form name="formPrincipal" onsubmit="return validar()">

      <div class="field-group">
        <label class="field-label" for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
        <span class="field-error" id="erroNome"></span>
      </div>

      <div class="field-group">
        <label class="field-label" for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail">
        <span class="field-error" id="erroEmail"></span>
      </div>

      <div class="field-group">
        <label class="field-label" for="comentarios">Comentários:</label>
        <textarea id="comentarios" name="comentarios" rows="4" placeholder="Digite seu comentário"></textarea>
        <span class="field-error" id="erroComentarios"></span>
      </div>

      <fieldset class="field-group pesquisa-group">
        <legend class="field-label">Pesquisa:</legend>
        <p class="pesquisa-question">Primeira vez nesta página?</p>
        <div class="radio-options">
          <label class="radio-label">
            <input type="radio" name="pesquisa" value="sim"> Sim
          </label>
          <label class="radio-label">
            <input type="radio" name="pesquisa" value="nao"> Não
          </label>
        </div>
        <span class="field-error" id="erroPesquisa"></span>
      </fieldset>

      <div class="btn-group">
        <button type="submit">Enviar</button>
        <button type="reset" class="btn-reset">Limpar</button>
      </div>

    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
