<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jogo de Pedra, Papel ou Tesoura - Jogador vs Computador">
    <title>Pedra, Papel ou Tesoura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Partículas decorativas -->
    <div class="particles" id="particles"></div>

    <main class="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🎮</span>
                <h1>JO-KEN-PÔ!</h1>
            </div>
            <p class="tagline">Jogador vs Computador</p>
        </header>

        <!-- Placar -->
        <section class="scores" id="scoreboard">
            <div class="score-box score-player" id="score-player-box">
                <div class="score-avatar">🧑</div>
                <div class="score-info">
                    <span class="score-name">Você</span>
                    <span class="score-num" id="player-score">0</span>
                </div>
            </div>
            <div class="score-box score-draw">
                <div class="score-num-center" id="draw-score">0</div>
                <span class="score-name-center">Empates</span>
            </div>
            <div class="score-box score-computer" id="score-computer-box">
                <div class="score-info">
                    <span class="score-name">PC</span>
                    <span class="score-num" id="computer-score">0</span>
                </div>
                <div class="score-avatar">🤖</div>
            </div>
        </section>

        <!-- Arena -->
        <section class="arena" id="arena">
            <div class="arena-player" id="arena-player">
                <div class="arena-hand" id="player-hand">
                    <span>❓</span>
                </div>
            </div>
            <div class="arena-center">
                <div class="arena-vs" id="arena-vs">VS</div>
            </div>
            <div class="arena-computer" id="arena-computer">
                <div class="arena-hand" id="computer-hand">
                    <span>❓</span>
                </div>
            </div>
        </section>

        <!-- Resultado -->
        <div class="result-banner" id="result-banner">
            <p id="result-text">Faça sua jogada! 👇</p>
        </div>

        <!-- Botões -->
        <section class="buttons" id="buttons">
            <button class="game-btn btn-rock" id="btn-pedra" data-choice="pedra">
                <span class="btn-emoji">🪨</span>
                <span class="btn-label">Pedra</span>
                <span class="btn-key">1</span>
            </button>
            <button class="game-btn btn-paper" id="btn-papel" data-choice="papel">
                <span class="btn-emoji">📄</span>
                <span class="btn-label">Papel</span>
                <span class="btn-key">2</span>
            </button>
            <button class="game-btn btn-scissors" id="btn-tesoura" data-choice="tesoura">
                <span class="btn-emoji">✂️</span>
                <span class="btn-label">Tesoura</span>
                <span class="btn-key">3</span>
            </button>
        </section>

        <!-- Info -->
        <section class="info-bar">
            <button class="info-btn" id="rules-btn">📖 Regras</button>
            <button class="info-btn" id="history-btn">📊 Histórico</button>
            <button class="info-btn reset" id="reset-btn">🗑️ Zerar</button>
        </section>

        <!-- Painel de Regras -->
        <div class="panel" id="rules-panel">
            <div class="panel-header">
                <h2>📖 Regras</h2>
                <button class="panel-close" data-close="rules-panel">✕</button>
            </div>
            <div class="panel-body">
                <div class="rule-item">
                    <span class="rule-emoji">🪨 → ✂️</span>
                    <span>Pedra <strong>quebra</strong> Tesoura</span>
                </div>
                <div class="rule-item">
                    <span class="rule-emoji">✂️ → 📄</span>
                    <span>Tesoura <strong>corta</strong> Papel</span>
                </div>
                <div class="rule-item">
                    <span class="rule-emoji">📄 → 🪨</span>
                    <span>Papel <strong>cobre</strong> Pedra</span>
                </div>
                <div class="rule-item">
                    <span class="rule-emoji">🟰</span>
                    <span>Mesma escolha = <strong>Empate!</strong></span>
                </div>
            </div>
        </div>

        <!-- Painel de Histórico -->
        <div class="panel" id="history-panel">
            <div class="panel-header">
                <h2>📊 Histórico</h2>
                <button class="panel-close" data-close="history-panel">✕</button>
            </div>
            <div class="panel-body" id="history-list">
                <p class="empty-state">Nenhuma rodada jogada ainda 🎲</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
